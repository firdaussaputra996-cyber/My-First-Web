<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Kurumi Tokisaki Fanpage</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #000000, #2b0000);
        color: white;
    }

    nav {
        background: #111;
        padding: 15px;
        text-align: center;
    }

    nav a {
        color: #ff4d6d;
        text-decoration: none;
        margin: 0 20px;
        font-weight: bold;
        transition: 0.3s;
    }

    nav a:hover {
        color: white;
        text-shadow: 0 0 10px red;
    }

    .section {
        display: none;
        padding: 40px;
        text-align: center;
    }

    .active {
        display: block;
    }

    h1 {
        color: #ff4d6d;
        text-shadow: 0 0 15px red;
    }

    img {
        width: 250px;
        border-radius: 10px;
        margin: 20px;
        border: 2px solid #ff4d6d;
    }

    button {
        background-color: #ff4d6d;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 20px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background-color: darkred;
        transform: scale(1.05);
    }

    footer {
        text-align: center;
        padding: 15px;
        background: #111;
        margin-top: 30px;
    }
</style>

<script>
function showSection(id) {
    let sections = document.querySelectorAll(".section");
    sections.forEach(sec => sec.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}
</script>

</head>

<nav>
    <a href="#" onclick="showSection('home')">Home</a>
    <a href="#" onclick="showSection('profil')">Profil Character</a>

</nav>
